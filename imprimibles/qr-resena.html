<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cartel QR reseña · Ferretera Montes</title>
<!-- Cartel imprimible: A4 apaisada con dos carteles A5 para cortar. Imprimir al 100% (sin "ajustar a página"). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@800&family=Barlow:wght@500;700&display=swap">
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #777; }
  body { font-family: Barlow, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hoja { width: 297mm; height: 210mm; margin: 0 auto; background: #fff; display: flex; position: relative; }
  .hoja::after { /* línea de corte */
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 0.3mm dashed #999;
  }
  .cartel {
    width: 148.5mm; height: 210mm; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(circle, rgba(0,0,0,.13) .45mm, transparent .55mm) 0 0 / 6mm 6mm, #f5b700;
    color: #1c1916; text-align: center;
  }
  .cab { background: #1c1916; padding: 9mm 0 8mm; display: flex; justify-content: center; }
  .sello { display: inline-flex; align-items: center; background: linear-gradient(180deg, #564b44, #4a413b 45%, #3b332e);
    color: #ece8e1; font: 400 7.2mm/1 "Saira Stencil One", sans-serif; letter-spacing: .1em; padding: 2.6mm 3.6mm; border-radius: 1mm;
    box-shadow: inset 0 0 0 .5mm rgba(0,0,0,.35); }
  .m { display: inline-grid; place-items: center; background: #f5b700; color: #4a413b; width: 1.55em; height: 1.55em;
    margin: -.3em .12em -.3em .25em; font-size: 1.3em; letter-spacing: 0; transform: rotate(10deg); border-radius: .6mm; }
  .cuerpo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12mm; }
  h1 { font: 800 11.5mm/1 Saira, sans-serif; text-transform: uppercase; margin-bottom: 4mm; }
  .sub { font: 500 5mm/1.3 Barlow, sans-serif; margin-bottom: 7mm; max-width: 105mm; }
  .sub b { font-weight: 700; }
  .qr { background: #fff; padding: 8mm; border: .8mm solid #1c1916; border-radius: 3mm; box-shadow: 2mm 2mm 0 #1c1916; }
  .qr img { display: block; width: 68mm; height: 68mm; }
  .estrellas { font-size: 9mm; letter-spacing: 1.5mm; margin: 7mm 0 3mm; line-height: 1; }
  .gracias { font: 700 5mm/1.2 Barlow, sans-serif; }
  .gracias small { display: block; font-weight: 500; font-size: 3.8mm; margin-top: 1mm; }
  .cinta { height: 8mm; background: repeating-linear-gradient(-45deg, #f5b700 0 5mm, #1c1916 5mm 10mm); }
  @media screen { body { padding: 10mm 0; } .hoja { box-shadow: 0 4mm 12mm rgba(0,0,0,.4); } }
</style>
</head>
<body>
  <div class="hoja">
    <template id="modelo">
      <div class="cartel">
        <div class="cab"><div class="sello">FERRETERA<span class="m">M</span>ONTES</div></div>
        <div class="cuerpo">
          <h1>¿Te atendimos bien?</h1>
          <p class="sub">Escaneá con la cámara del celular y <b>dejanos tu reseña en Google</b>. Nos ayuda muchísimo.</p>
          <div class="qr"><img src="qr-resena.svg" alt="QR para dejar una reseña en Google"></div>
          <div class="estrellas">★★★★★</div>
          <p class="gracias">¡Gracias por elegirnos!<small>Diego y familia · Blvd. Rondeau 762</small></p>
        </div>
        <div class="cinta"></div>
      </div>
    </template>
  </div>
  <script>
    // Dos carteles iguales por hoja
    const hoja = document.querySelector('.hoja'), modelo = document.getElementById('modelo');
    for (let i = 0; i < 2; i++) hoja.appendChild(modelo.content.cloneNode(true));
  </script>
</body>
</html>
