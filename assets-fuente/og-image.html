<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira:wght@800&family=Barlow:wght@500;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: Barlow, sans-serif;
    background: repeating-linear-gradient(-45deg, transparent 0 46px, rgba(245,183,0,.07) 46px 92px),
                radial-gradient(circle at 40% 42%, #3a342f, #1c1916 72%); color: #fff; }
  .cinta { position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    background: repeating-linear-gradient(-45deg, #f5b700 0 28px, #1c1916 28px 56px); }
  .contenido { position: absolute; left: 70px; top: 0; bottom: 34px; width: 780px; display: flex; flex-direction: column; justify-content: center; }
  .pre { color: #f5b700; font: 800 22px/1 Saira, sans-serif; letter-spacing: 5px; margin-bottom: 62px; }
  .cartel { position: relative; align-self: flex-start; display: inline-flex; align-items: center;
    font: 400 62px/1 "Saira Stencil One", sans-serif; letter-spacing: .1em; color: #ece8e1; padding: .38em .5em;
    border-radius: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 9px), linear-gradient(180deg, #564b44, #4a413b 45%, #3b332e);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.35), 0 26px 40px rgba(0,0,0,.6); }
  .m { display: inline-grid; place-items: center; background: #f5b700; color: #4a413b; width: 1.55em; height: 1.55em;
    margin: -.3em .12em -.3em .25em; font-size: 1.3em; letter-spacing: 0; transform: rotate(10deg); border-radius: 3px; box-shadow: 2px 4px 6px rgba(0,0,0,.5); }
  .clavo { position: absolute; left: 18%; bottom: 100%; width: 34px; height: 40px; margin-left: -17px; }
  .clavo i { position: absolute; left: 14px; top: 8px; width: 7px; bottom: 0; background: linear-gradient(90deg,#2f353a,#b9c2c8 30%,#f4f7f9 45%,#8d979e 65%,#2a3035); }
  .clavo b { position: absolute; left: 0; right: 0; top: 0; height: 9px; border-radius: 4px/3px; background: linear-gradient(180deg,#fdfefe,#c3cbd1 35%,#6b747b 70%,#353b40); box-shadow: 0 0 0 1px #1d2226; }
  .lema { font: 800 46px/1 Saira, sans-serif; text-transform: uppercase; margin: 44px 0 26px; }
  .lema span { color: #f5b700; }
  .datos { display: flex; gap: 14px; }
  .datos div { background: rgba(0,0,0,.45); border: 2px solid rgba(245,183,0,.55); border-radius: 8px; padding: 10px 18px; font: 500 22px/1.2 Barlow, sans-serif; color: #ece8e1; }
  .datos b { color: #f5b700; font-weight: 700; }
  .martillo { position: absolute; right: 60px; top: 40px; height: 540px; transform: rotate(16deg); transform-origin: 50% 50%;
    filter: drop-shadow(18px 24px 16px rgba(0,0,0,.6)); }
</style></head>
<body>
  <img class="martillo" src="../martillo.png">
  <div class="contenido">
    <div class="pre">FERRETERÍA FAMILIAR · ROSARIO</div>
    <div class="cartel"><span class="clavo"><i></i><b></b></span>FERRETERA<span class="m">M</span>ONTES</div>
    <div class="lema">Todo para tu <span>obra</span></div>
    <div class="datos">
      <div><b>Blvd. Rondeau 762</b></div>
      <div><b>4.8 ★</b> en Google</div>
      <div>Envíos a domicilio</div>
    </div>
  </div>
  <div class="cinta"></div>
</body></html>
